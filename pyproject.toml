[project]
name = "primitive-neural-network"
version = "0.1.0"
description = "neural network and autograd implementation from scratch"
authors = [
    {name = "ZheRao",email = "zheraoeminem@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]
name = "primitive-neural-network"
packages = [
  { include = "pnn", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
]
